# The bundled SQLite without the parts Kanzo never uses: full-text search, R-trees,
# stats for the query planner, extensions, shared cache, deprecated calls, memory
# statistics. The program is 7% smaller; the database file and behaviour are the same.
[env]
LIBSQLITE3_FLAGS = """\
  -USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE \
  -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION \
  -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_MAX_EXPR_DEPTH=0"""

# Windows builds with llvm-mingw: link the C runtime and unwinder in, so kanzo.exe
# needs no DLL beyond what Windows ships.
[target.aarch64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]
